edition = "2021"
# Recent nightly rustfmt deprecates the `version` option in favour of
# `style_edition`. Keeping the newer key avoids the deprecation warning on
# every CI run while preserving the "Two"-era formatting the workspace was
# written with (the edition itself stays 2021 so stable builds are unaffected).
style_edition = "2024"
wrap_comments = true
format_code_in_doc_comments = true
format_strings = true
normalize_comments = true
normalize_doc_attributes = true
group_imports = "StdExternalCrate"
imports_granularity = "Crate"
reorder_imports = true
reorder_modules = true
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Max"
struct_lit_single_line = false
fn_single_line = false
where_single_line = false
match_block_trailing_comma = true
trailing_semicolon = true
use_field_init_shorthand = true
